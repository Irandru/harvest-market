<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0"/>
  <title>Harvest Market</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Firebase untuk multiplayer leaderboard & chat -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;background:#0f172a;font-family:'Segoe UI',sans-serif}
    input,button{font-family:inherit}
    ::-webkit-scrollbar{width:4px}
    ::-webkit-scrollbar-thumb{background:#334155;border-radius:2px}
    @keyframes slideIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
    @keyframes pop{0%{transform:scale(0.5);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useRef } = React;

// ================================================================
//  FIREBASE CONFIG
//  Isi dengan config Firebase kamu untuk aktifkan multiplayer.
//  Kalau tidak diisi, game tetap bisa dimain tapi leaderboard
//  hanya menampilkan bot dan tidak ada chat.
//
//  Cara dapat config: console.firebase.google.com
//  > Project Settings > Your apps > Add Web App > copy config
// ================================================================
const FIREBASE_CONFIG = {
  apiKey:            "PASTE_DI_SINI",
  authDomain:        "PASTE_DI_SINI",
  projectId:         "PASTE_DI_SINI",
  storageBucket:     "PASTE_DI_SINI",
  messagingSenderId: "PASTE_DI_SINI",
  appId:             "PASTE_DI_SINI"
};

let db = null;
try {
  if (FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.includes("PASTE")) {
    firebase.initializeApp(FIREBASE_CONFIG);
    db = firebase.firestore();
  }
} catch(e) {}

// ================================================================
//  KONSTANTA GAME
// ================================================================
const CROPS = [
  { id:"kangkung", name:"Kangkung", emoji:"🥬", seedPrice:500,   basePrice:2500,  growTime:8  },
  { id:"padi",     name:"Padi",     emoji:"🌾", seedPrice:1500,  basePrice:7000,  growTime:15 },
  { id:"jagung",   name:"Jagung",   emoji:"🌽", seedPrice:4000,  basePrice:16000, growTime:22 },
  { id:"tomat",    name:"Tomat",    emoji:"🍅", seedPrice:10000, basePrice:38000, growTime:32 },
  { id:"cabai",    name:"Cabai",    emoji:"🫑", seedPrice:25000, basePrice:92000, growTime:48 },
];
const UNLOCK_THRESHOLDS = { padi:100000, jagung:500000, tomat:1000000, cabai:10000000 };
const UNLOCK_ORDER = ["kangkung","padi","jagung","tomat","cabai"];
const LEVEL_XP     = [0,100000,500000,2000000,10000000,50000000,200000000,1000000000,5000000000,20000000000];
const LEVEL_NAMES  = ["Petani Baru","Petani Muda","Petani Handal","Petani Ahli","Juragan Tani","Konglomerat","Raja Kebun","Mogul Tani","Legenda Tani","Dewa Panen"];
const LEVEL_EMOJIS = ["🌱","🌿","🌾","🌽","🍅","🫑","👑","💎","🔱","🏆"];
const FERTILIZERS  = [
  { id:"pupuk1", name:"Pupuk Biasa",   emoji:"🌿", price:50000,  minM:1, maxM:2 },
  { id:"pupuk2", name:"Pupuk Super",   emoji:"💚", price:200000, minM:2, maxM:3 },
  { id:"pupuk3", name:"Pupuk Premium", emoji:"⭐", price:500000, minM:3, maxM:5 },
];
const DUMMIES = [
  { name:"BosAgro",    farm:"Konglomerat Farm",     score:4800000000, vel:4200000 },
  { name:"MegaTani",   farm:"Mega Agro Corp",       score:2150000000, vel:2800000 },
  { name:"RajaKebun",  farm:"Kebun Raya Nusantara", score:910000000,  vel:1500000 },
  { name:"GreenKing",  farm:"Green Empire",         score:460000000,  vel:900000  },
  { name:"PakHartono", farm:"Tani Makmur Group",    score:215000000,  vel:500000  },
  { name:"AgroLegend", farm:"Agro Legend Corp",     score:98000000,   vel:280000  },
  { name:"BuSarimah",  farm:"Kebun Segar Abadi",    score:44000000,   vel:150000  },
  { name:"PakDodik",   farm:"Ladang Subur Jaya",    score:19000000,   vel:80000   },
  { name:"SitiNurlia", farm:"Ladang Berkah",        score:7400000,    vel:40000   },
  { name:"TaniMasJaya",farm:"Sawah Emas",           score:2900000,    vel:18000   },
  { name:"NusaTani88", farm:"Sawah Nusantara",      score:870000,     vel:8000    },
  { name:"PakBudiS",   farm:"Kebun Makmur",         score:290000,     vel:3000    },
];
const EVENTS = [
  { msg:"Musim Hujan! Padi melonjak!",    crop:"padi",     mult:1.75, icon:"🌧" },
  { msg:"Kemarau! Cabai naik drastis!",   crop:"cabai",    mult:1.9,  icon:"🔆" },
  { msg:"Impor besar! Jagung anjlok!",    crop:"jagung",   mult:0.45, icon:"📦" },
  { msg:"Festival Panen! Semua naik!",    crop:null,       mult:1.35, icon:"🎉" },
  { msg:"Hama! Tomat melonjak!",          crop:"tomat",    mult:1.8,  icon:"🦠" },
  { msg:"Oversupply! Kangkung murah!",    crop:"kangkung", mult:0.5,  icon:"📉" },
  { msg:"Ekspor dibuka! Semua naik!",     crop:null,       mult:1.4,  icon:"🚢" },
  { msg:"Cuaca Ekstrem! Cabai meledak!",  crop:"cabai",    mult:2.1,  icon:"🌪" },
];
const TAUNTS = [
  "Kebun gw lebih keren! 😎","Udah nyerah aja bro 😂","GG bro! 👏",
  "Kejar dong kalau bisa 🚀","Enak ya jadi nomor 1 😄","Coba lagi tahun depan 🤣",
  "Kasian deh 😜","Semangat yaa 💪",
];

// ================================================================
//  HELPERS
// ================================================================
const fmt = n => {
  const v = Math.round(n);
  if (v >= 1000000000) return "Rp "+(v/1000000000).toFixed(1)+"M";
  if (v >= 1000000)    return "Rp "+(v/1000000).toFixed(1)+"jt";
  if (v >= 1000)       return "Rp "+(v/1000).toFixed(0)+"rb";
  return "Rp "+v.toLocaleString("id-ID");
};
const fmtFull = n => "Rp "+Math.round(n).toLocaleString("id-ID");
const initPrices  = () => Object.fromEntries(CROPS.map(c => [c.id, c.basePrice]));
const initHistory = () => Object.fromEntries(CROPS.map(c => [c.id, [c.basePrice, c.basePrice]]));

const loadSave = () => { try { return JSON.parse(localStorage.getItem("hm_save")||"{}"); } catch(e) { return {}; } };
const writeSave = data => { try { localStorage.setItem("hm_save", JSON.stringify(data)); } catch(e) {} };

// Firebase helpers
const fbUploadScore = async (playerName, farmName, score) => {
  if (!db) return;
  try { await db.collection("hm_lb").doc(playerName.replace(/\W/g,"_")).set({ playerName, farmName, score, ts: Date.now() }); } catch(e) {}
};
const fbFetchLB = async () => {
  if (!db) return [];
  try {
    const snap = await db.collection("hm_lb").orderBy("score","desc").limit(25).get();
    return snap.docs.map(d => d.data());
  } catch(e) { return []; }
};
const fbSendChat = async (name, farm, msg) => {
  if (!db) return;
  try { await db.collection("hm_chat").add({ name, farm, msg, ts: Date.now() }); } catch(e) {}
};
const fbFetchChat = async () => {
  if (!db) return [];
  try {
    const snap = await db.collection("hm_chat").orderBy("ts","desc").limit(30).get();
    return snap.docs.map(d => d.data());
  } catch(e) { return []; }
};

// ================================================================
//  KOMPONEN KECIL
// ================================================================
function Sparkline({ data }) {
  if (!data || data.length < 2) return null;
  const W=60, H=22, mn=Math.min(...data), mx=Math.max(...data), rng=mx-mn||1;
  const pts = data.map((v,i) => `${(i/(data.length-1))*W},${H-((v-mn)/rng)*(H-3)-1}`).join(" ");
  const col = data[data.length-1] >= data[data.length-2] ? "#4ade80" : "#f87171";
  return <svg width={W} height={H}><polyline points={pts} fill="none" stroke={col} strokeWidth="2" strokeLinejoin="round"/></svg>;
}

function Toast({ items }) {
  return (
    <div style={{position:"fixed",top:10,right:10,zIndex:1000,display:"flex",flexDirection:"column",gap:6,maxWidth:270}}>
      {items.map((t,i) => (
        <div key={i} style={{background:t.type==="unlock"?"#7c3aed":t.type==="level"?"#1d4ed8":"#15803d",color:"#fff",borderRadius:10,padding:"10px 14px",fontSize:13,fontWeight:"bold",boxShadow:"0 4px 20px rgba(0,0,0,0.5)",animation:"slideIn 0.3s ease"}}>
          {t.msg}
        </div>
      ))}
    </div>
  );
}

function LevelUpModal({ level, onClose }) {
  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.88)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:999,padding:20}}>
      <div style={{background:"linear-gradient(135deg,#1e1b4b,#312e81)",border:"2px solid #818cf8",borderRadius:20,padding:32,textAlign:"center",maxWidth:320,width:"100%",animation:"pop 0.4s ease"}}>
        <div style={{fontSize:64,marginBottom:4}}>{LEVEL_EMOJIS[Math.min(level-1,9)]}</div>
        <div style={{fontSize:11,color:"#a5b4fc",letterSpacing:3,marginBottom:4}}>NAIK LEVEL!</div>
        <div style={{fontSize:56,fontWeight:900,color:"#fff",lineHeight:1}}>Level {level}</div>
        <div style={{fontSize:20,color:"#c7d2fe",margin:"10px 0 24px"}}>{LEVEL_NAMES[Math.min(level-1,9)]}</div>
        <button onClick={onClose} style={{background:"linear-gradient(90deg,#6366f1,#8b5cf6)",border:"none",color:"#fff",borderRadius:12,padding:"14px 28px",fontWeight:"bold",fontSize:16,cursor:"pointer",width:"100%"}}>
          Lanjutkan!
        </button>
      </div>
    </div>
  );
}

function UnlockModal({ crop, onClose }) {
  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.88)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:999,padding:20}}>
      <div style={{background:"linear-gradient(135deg,#14532d,#166534)",border:"2px solid #4ade80",borderRadius:20,padding:32,textAlign:"center",maxWidth:320,width:"100%",animation:"pop 0.4s ease"}}>
        <div style={{fontSize:72,marginBottom:4}}>{crop.emoji}</div>
        <div style={{fontSize:11,color:"#86efac",letterSpacing:3,marginBottom:4}}>TERBUKA!</div>
        <div style={{fontSize:32,fontWeight:900,color:"#fff",marginBottom:6}}>{crop.name}</div>
        <div style={{fontSize:13,color:"#86efac",marginBottom:4}}>Benih: {fmtFull(crop.seedPrice)}</div>
        <div style={{fontSize:12,color:"#4ade80",marginBottom:24}}>Harga jual: ~{fmtFull(crop.basePrice)}</div>
        <button onClick={onClose} style={{background:"#16a34a",border:"none",color:"#fff",borderRadius:12,padding:"14px 28px",fontWeight:"bold",fontSize:16,cursor:"pointer",width:"100%"}}>
          Siap Tanam!
        </button>
      </div>
    </div>
  );
}

// ================================================================
//  MAIN APP
// ================================================================
function App() {
  const [page, setPage]             = useState("loading");
  const [nameIn, setNameIn]         = useState("");
  const [farmIn, setFarmIn]         = useState("");
  const [playerName, setPlayerName] = useState("");
  const [farmName, setFarmName]     = useState("");
  const [money, setMoney]           = useState(5000);
  const [totalEarned, setTE]        = useState(0);
  const [earnedSince, setES]        = useState(0);
  const [level, setLevel]           = useState(1);
  const [plots, setPlots]           = useState(Array(16).fill(null));
  const [inventory, setInventory]   = useState({});
  const [fertilizers, setFerts]     = useState({pupuk1:0,pupuk2:0,pupuk3:0});
  const [owned, setOwned]           = useState({autoHarvest:false,autoPlant:false});
  const [selCrop, setSelCrop]       = useState("kangkung");
  const [selFert, setSelFert]       = useState(null);
  const [unlocked, setUnlocked]     = useState(["kangkung"]);
  const [nextUnlock, setNextUnlock] = useState("padi");
  const [prices, setPrices]         = useState(initPrices());
  const [priceHist, setPriceHist]   = useState(initHistory());
  const [tab, setTab]               = useState("farm");
  const [eventMsg, setEventMsg]     = useState(null);
  const [lvModal, setLvModal]       = useState(null);
  const [ulModal, setUlModal]       = useState(null);
  const [toasts, setToasts]         = useState([]);
  const [gameLog, setGameLog]       = useState(["Modal Rp 5.000! Tanam Kangkung, kumpulkan 100rb buat buka Padi."]);
  const [tick, setTick]             = useState(0);
  const [dScores, setDScores]       = useState(() => DUMMIES.map(d => d.score));
  const [realPlayers, setRealPlayers] = useState([]);
  const [knownPlayers, setKnown]    = useState(new Set());
  const [chatLog, setChatLog]       = useState([]);
  const [chatInput, setChatInput]   = useState("");
  const [chatBusy, setChatBusy]     = useState(false);

  const moneyRef   = useRef(5000);
  const unlockedRef = useRef(["kangkung"]);
  const selCropRef  = useRef("kangkung");
  const fertRef     = useRef({pupuk1:0,pupuk2:0,pupuk3:0});
  const selFertRef  = useRef(null);
  const ownedRef    = useRef({autoHarvest:false,autoPlant:false});
  const knownRef    = useRef(new Set());
  const pnRef       = useRef("");

  useEffect(()=>{ moneyRef.current=money; },[money]);
  useEffect(()=>{ unlockedRef.current=unlocked; },[unlocked]);
  useEffect(()=>{ selCropRef.current=selCrop; },[selCrop]);
  useEffect(()=>{ fertRef.current=fertilizers; },[fertilizers]);
  useEffect(()=>{ selFertRef.current=selFert; },[selFert]);
  useEffect(()=>{ ownedRef.current=owned; },[owned]);
  useEffect(()=>{ knownRef.current=knownPlayers; },[knownPlayers]);
  useEffect(()=>{ pnRef.current=playerName; },[playerName]);

  const addLog  = useCallback(msg => setGameLog(p => [msg,...p].slice(0,8)),[]);
  const pushToast = useCallback((msg,type="info") => {
    const id = Date.now();
    setToasts(p => [...p,{msg,type,id}]);
    setTimeout(() => setToasts(p => p.filter(t=>t.id!==id)), 3500);
  },[]);

  const doSave = useCallback((patch={}) => {
    writeSave({playerName,farmName,money,totalEarned,earnedSince,level,unlocked,nextUnlock,inventory,fertilizers,owned,...patch});
  },[playerName,farmName,money,totalEarned,earnedSince,level,unlocked,nextUnlock,inventory,fertilizers,owned]);

  // Load save
  useEffect(()=>{
    const d = loadSave();
    if (d.playerName) {
      setPlayerName(d.playerName); setFarmName(d.farmName);
      setMoney(d.money??5000); setTE(d.totalEarned||0);
      setES(d.earnedSince||0); setLevel(d.level||1);
      setUnlocked(d.unlocked||["kangkung"]); setNextUnlock(d.nextUnlock||"padi");
      setInventory(d.inventory||{}); setFerts(d.fertilizers||{pupuk1:0,pupuk2:0,pupuk3:0});
      setOwned(d.owned||{autoHarvest:false,autoPlant:false});
      setKnown(new Set([d.playerName]));
      setPage("game");
    } else {
      setPage("setup");
    }
  },[]);

  // Tick
  useEffect(()=>{ const id=setInterval(()=>setTick(t=>t+1),1000); return ()=>clearInterval(id); },[]);

  // Price update every 5s
  useEffect(()=>{
    if (!tick||tick%5!==0) return;
    setPrices(prev=>{
      const next={};
      CROPS.forEach(c=>{
        const drift=(Math.random()-0.46)*c.basePrice*0.13;
        next[c.id]=Math.max(Math.round(c.basePrice*0.25),Math.round(prev[c.id]+drift));
      });
      setPriceHist(ph=>{ const nh={}; CROPS.forEach(c=>{nh[c.id]=[...(ph[c.id]||[]),next[c.id]].slice(-18);}); return nh; });
      return next;
    });
    setDScores(prev=>prev.map((s,i)=>s+Math.floor(DUMMIES[i].vel*(0.5+Math.random()))));
  },[tick]);

  // Random events every 45s
  useEffect(()=>{
    if (!tick||tick%45!==0) return;
    const ev=EVENTS[Math.floor(Math.random()*EVENTS.length)];
    setEventMsg(ev.icon+" "+ev.msg); addLog(ev.icon+" "+ev.msg);
    setPrices(prev=>{ const n={...prev}; if(ev.crop) n[ev.crop]=Math.round(prev[ev.crop]*ev.mult); else CROPS.forEach(c=>{n[c.id]=Math.round(prev[c.id]*ev.mult);}); return n; });
    setTimeout(()=>setEventMsg(null),6000);
  },[tick]);

  // Upload score + fetch LB every 30s
  useEffect(()=>{
    if (page!=="game"||!tick||tick%30!==0) return;
    const pn=pnRef.current; if(!pn) return;
    fbUploadScore(pn, farmName, totalEarned);
    (async()=>{
      const players = await fbFetchLB();
      setRealPlayers(players);
      const known=knownRef.current;
      players.filter(p=>p.playerName!==pn&&!known.has(p.playerName)).forEach(p=>{
        pushToast("🌾 "+p.playerName+" masuk! Kebun: "+p.farmName,"info");
        setKnown(prev=>new Set([...prev,p.playerName]));
      });
      const chat = await fbFetchChat();
      setChatLog(chat);
    })();
  },[tick,page,totalEarned,farmName]);

  // Level check
  useEffect(()=>{
    if (page!=="game") return;
    const newLv=LEVEL_XP.filter(xp=>totalEarned>=xp).length;
    if (newLv>level){ setLevel(newLv); setLvModal(newLv); pushToast("Level "+newLv+" tercapai!","level"); }
  },[totalEarned]);

  // Unlock check
  useEffect(()=>{
    if (!nextUnlock||unlocked.includes(nextUnlock)) return;
    if (earnedSince>=UNLOCK_THRESHOLDS[nextUnlock]) {
      const crop=CROPS.find(c=>c.id===nextUnlock);
      setUnlocked(prev=>{
        if (prev.includes(crop.id)) return prev;
        const nu=[...prev,crop.id];
        const idx=UNLOCK_ORDER.indexOf(crop.id);
        const nxt=UNLOCK_ORDER[idx+1]||null;
        setNextUnlock(nxt); setES(0); setUlModal(crop);
        pushToast(crop.emoji+" "+crop.name+" terbuka!","unlock");
        doSave({unlocked:nu,nextUnlock:nxt,earnedSince:0});
        return nu;
      });
    }
  },[earnedSince,nextUnlock]);

  // Auto harvest
  useEffect(()=>{
    if (!tick||!ownedRef.current.autoHarvest) return;
    setPlots(prev=>{
      const harvested=[]; 
      const next=prev.map(plot=>{
        if (!plot) return null;
        const crop=CROPS.find(c=>c.id===plot.crop);
        if (tick-plot.plantedAt>=crop.growTime){
          const f=plot.fertilizer?FERTILIZERS.find(f=>f.id===plot.fertilizer):null;
          const mult=f?Math.floor(Math.random()*(f.maxM-f.minM+1))+f.minM:1;
          harvested.push({cropId:plot.crop,mult}); return null;
        }
        return plot;
      });
      if (harvested.length) setInventory(inv=>{ const ni={...inv}; harvested.forEach(h=>{ni[h.cropId]=(ni[h.cropId]||0)+h.mult;}); return ni; });
      return harvested.length?next:prev;
    });
  },[tick]);

  // Auto plant
  useEffect(()=>{
    if (!tick||tick%2!==0||!ownedRef.current.autoPlant) return;
    const cid=selCropRef.current;
    const crop=CROPS.find(c=>c.id===cid);
    if (!crop||!unlockedRef.current.includes(cid)) return;
    setPlots(prev=>{
      const next=[...prev]; let count=0;
      for (let i=0;i<next.length;i++){
        if (next[i]!==null) continue;
        if (moneyRef.current<crop.seedPrice*(count+1)) break;
        const fid=selFertRef.current;
        next[i]={crop:cid,plantedAt:tick,fertilizer:fid&&fertRef.current[fid]>0?fid:null};
        count++;
      }
      if (count>0) setMoney(m=>m-crop.seedPrice*count);
      return count?next:prev;
    });
  },[tick]);

  const handleSetup = () => {
    if (!nameIn.trim()||!farmIn.trim()) return;
    const pn=nameIn.trim(), fn=farmIn.trim();
    setPlayerName(pn); setFarmName(fn); setKnown(new Set([pn])); setPage("game");
    writeSave({playerName:pn,farmName:fn,money:5000,totalEarned:0,earnedSince:0,level:1,unlocked:["kangkung"],nextUnlock:"padi",inventory:{},fertilizers:{pupuk1:0,pupuk2:0,pupuk3:0},owned:{autoHarvest:false,autoPlant:false}});
    fbUploadScore(pn,fn,0);
  };

  const plant = idx => {
    if (plots[idx]||!unlocked.includes(selCrop)) return;
    const crop=CROPS.find(c=>c.id===selCrop);
    if (money<crop.seedPrice){ addLog("Uang tidak cukup!"); return; }
    const fid=selFert&&fertilizers[selFert]>0?selFert:null;
    if (fid) setFerts(prev=>({...prev,[fid]:prev[fid]-1}));
    setMoney(m=>m-crop.seedPrice);
    setPlots(p=>{ const n=[...p]; n[idx]={crop:selCrop,plantedAt:tick,fertilizer:fid}; return n; });
  };

  const harvest = idx => {
    const plot=plots[idx]; if (!plot) return;
    const crop=CROPS.find(c=>c.id===plot.crop);
    if (tick-plot.plantedAt<crop.growTime) return;
    const f=plot.fertilizer?FERTILIZERS.find(f=>f.id===plot.fertilizer):null;
    const mult=f?Math.floor(Math.random()*(f.maxM-f.minM+1))+f.minM:1;
    setInventory(inv=>({...inv,[plot.crop]:(inv[plot.crop]||0)+mult}));
    setPlots(p=>{ const n=[...p]; n[idx]=null; return n; });
    addLog("Panen "+crop.name+(mult>1?" x"+mult+"!":""));
  };

  const sell = (cropId, all) => {
    const cnt=all?(inventory[cropId]||0):1; if (cnt<1) return;
    const income=prices[cropId]*cnt;
    const nm=money+income, nte=totalEarned+income, nes=earnedSince+income;
    const ni={...inventory,[cropId]:(inventory[cropId]||0)-cnt};
    setMoney(nm); setTE(nte); setES(nes); setInventory(ni);
    addLog("Jual "+CROPS.find(c=>c.id===cropId).name+(all?" x"+cnt:"")+": +"+fmt(income));
    doSave({money:nm,totalEarned:nte,earnedSince:nes,inventory:ni});
  };

  const buyItem = item => {
    if (money<item.price){ addLog("Kurang modal!"); return; }
    if (item.oneTime){
      if (owned[item.id]){ addLog("Sudah dimiliki!"); return; }
      const no={...owned,[item.id]:true};
      setOwned(no); setMoney(m=>m-item.price);
      addLog("Beli "+item.name+"!"); doSave({owned:no,money:money-item.price});
    } else {
      const nf={...fertilizers,[item.id]:(fertilizers[item.id]||0)+1};
      setFerts(nf); setMoney(m=>m-item.price);
      addLog("Beli "+item.name); doSave({fertilizers:nf,money:money-item.price});
    }
  };

  const sendChat = async msg => {
    if (!msg.trim()||chatBusy) return;
    setChatBusy(true);
    await fbSendChat(playerName,farmName,msg.trim());
    const updated=[{name:playerName,farm:farmName,msg:msg.trim(),ts:Date.now()},...chatLog].slice(0,30);
    setChatLog(updated); setChatInput("");
    setChatBusy(false);
  };

  const getProgress = plot => {
    if (!plot) return 0;
    return Math.min(100,Math.round(((tick-plot.plantedAt)/CROPS.find(c=>c.id===plot.crop).growTime)*100));
  };

  const buildLB = () => {
    const me={playerName,farmName,score:totalEarned,isMe:true,isReal:true};
    const seen=new Set([playerName]);
    const rp=realPlayers.filter(p=>{ if(seen.has(p.playerName)) return false; seen.add(p.playerName); return true; }).map(p=>({...p,isMe:false,isReal:true}));
    const dm=DUMMIES.map((d,i)=>({playerName:d.name,farmName:d.farm,score:dScores[i],isMe:false,isReal:false}))
      .filter(d=>{ if(seen.has(d.playerName)) return false; seen.add(d.playerName); return true; });
    return [me,...rp,...dm].sort((a,b)=>b.score-a.score);
  };

  const lv=Math.min(level,LEVEL_XP.length-1);
  const nextXP=LEVEL_XP[lv]||LEVEL_XP[LEVEL_XP.length-1];
  const prevXP=LEVEL_XP[level-1]||0;
  const lvProg=nextXP>prevXP?Math.min(100,((totalEarned-prevXP)/(nextXP-prevXP))*100):100;
  const nextCrop=nextUnlock?CROPS.find(c=>c.id===nextUnlock):null;
  const nextReq=nextUnlock?UNLOCK_THRESHOLDS[nextUnlock]:null;
  const ulProg=nextReq?Math.min(100,(earnedSince/nextReq)*100):100;
  const lb=buildLB(), myRank=lb.findIndex(e=>e.isMe)+1;
  const invVal=Object.entries(inventory).reduce((s,[k,v])=>s+(v||0)*prices[k],0);

  const S = {
    wrap:{fontFamily:"'Segoe UI',sans-serif",background:"#0f172a",minHeight:"100vh",color:"#e2e8f0",padding:10,maxWidth:480,margin:"0 auto",boxSizing:"border-box"},
    card:{background:"#1e293b",borderRadius:14,padding:12,marginBottom:8},
    tab: a=>({background:a?"#16a34a":"#1e293b",border:"1px solid "+(a?"#16a34a":"#334155"),color:a?"#fff":"#94a3b8",borderRadius:10,padding:"11px 0",cursor:"pointer",fontWeight:"bold",fontSize:12,flex:1,touchAction:"manipulation"}),
    btn:(bg,fg="#fff")=>({background:bg,border:"none",color:fg,borderRadius:10,padding:"11px 16px",cursor:"pointer",fontSize:13,fontWeight:"bold",touchAction:"manipulation",whiteSpace:"nowrap"}),
  };

  // ── LOADING ──
  if (page==="loading") return <div style={{...S.wrap,display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh"}}><div style={{color:"#475569",fontSize:16}}>Memuat...</div></div>;

  // ── SETUP ──
  if (page==="setup") return (
    <div style={{background:"#0f172a",minHeight:"100vh",display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:"#1e293b",borderRadius:20,padding:30,maxWidth:360,width:"100%",textAlign:"center",border:"1px solid #334155"}}>
        <div style={{fontSize:56,marginBottom:8}}>🌾</div>
        <div style={{fontSize:24,fontWeight:900,color:"#e2e8f0",marginBottom:4}}>Harvest Market</div>
        <div style={{color:"#64748b",fontSize:13,marginBottom:24}}>Dari Rp 5.000 menuju miliaran!</div>
        {[["Nama Petani",nameIn,setNameIn,"Contoh: PakBudi"],["Nama Kebun",farmIn,setFarmIn,"Contoh: Kebun Makmur"]].map(([l,v,s,ph])=>(
          <div key={l} style={{textAlign:"left",marginBottom:14}}>
            <div style={{fontSize:12,color:"#94a3b8",marginBottom:6}}>{l}</div>
            <input value={v} onChange={e=>s(e.target.value)} placeholder={ph} maxLength={20}
              style={{width:"100%",background:"#0f172a",border:"1px solid #334155",borderRadius:10,padding:"13px 14px",color:"#fff",fontSize:15,outline:"none",boxSizing:"border-box"}}/>
          </div>
        ))}
        <button onClick={handleSetup} disabled={!nameIn.trim()||!farmIn.trim()}
          style={{width:"100%",background:nameIn.trim()&&farmIn.trim()?"linear-gradient(90deg,#16a34a,#15803d)":"#334155",border:"none",color:"#fff",borderRadius:12,padding:15,fontSize:16,fontWeight:"bold",cursor:"pointer",touchAction:"manipulation",marginTop:4}}>
          Mulai Bertani!
        </button>
        {!db && <div style={{fontSize:11,color:"#475569",marginTop:10}}>Mode lokal — tambahkan Firebase untuk leaderboard multiplayer</div>}
      </div>
    </div>
  );

  // ── GAME ──
  return (
    <div style={S.wrap}>
      {lvModal && <LevelUpModal level={lvModal} onClose={()=>setLvModal(null)}/>}
      {ulModal && <UnlockModal  crop={ulModal}  onClose={()=>setUlModal(null)}/>}
      <Toast items={toasts}/>

      {/* Header */}
      <div style={{background:"linear-gradient(135deg,#14532d,#15803d)",borderRadius:16,padding:"12px 14px",marginBottom:8,border:"1px solid #166534"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
          <div>
            <div style={{fontSize:16,fontWeight:800}}>🌾 {farmName}</div>
            <div style={{fontSize:11,color:"#86efac",marginTop:2}}>{LEVEL_EMOJIS[Math.min(level-1,9)]} Lv{level} {LEVEL_NAMES[Math.min(level-1,9)]} — #{myRank}</div>
          </div>
          <div style={{textAlign:"right"}}>
            <div style={{fontSize:17,fontWeight:900,color:"#fbbf24"}}>{fmtFull(money)}</div>
            <div style={{fontSize:11,color:"#86efac"}}>Total: {fmt(totalEarned)}</div>
          </div>
        </div>
        <div style={{marginTop:8}}>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"#86efac",marginBottom:3}}>
            <span>Lv{level} → {level+1}</span><span>{fmt(totalEarned)} / {fmt(nextXP)}</span>
          </div>
          <div style={{height:5,background:"rgba(0,0,0,0.3)",borderRadius:3}}>
            <div style={{width:lvProg+"%",height:"100%",background:"linear-gradient(90deg,#fbbf24,#f59e0b)",borderRadius:3,transition:"width 0.5s"}}/>
          </div>
        </div>
      </div>

      {nextCrop && (
        <div style={{...S.card,padding:"9px 12px",marginBottom:8}}>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:11,marginBottom:4}}>
            <span style={{color:"#94a3b8"}}>Unlock {nextCrop.emoji} {nextCrop.name}</span>
            <span style={{color:"#fbbf24"}}>{fmt(earnedSince)} / {fmt(nextReq)}</span>
          </div>
          <div style={{height:6,background:"#334155",borderRadius:3}}>
            <div style={{width:ulProg+"%",height:"100%",background:"linear-gradient(90deg,#7c3aed,#a855f7)",borderRadius:3,transition:"width 0.5s"}}/>
          </div>
        </div>
      )}

      {eventMsg && <div style={{background:"#b45309",borderRadius:10,padding:"10px 14px",marginBottom:8,fontWeight:"bold",fontSize:13,textAlign:"center"}}>{eventMsg}</div>}

      {/* Tabs */}
      <div style={{display:"flex",gap:4,marginBottom:8}}>
        {[["farm","Kebun"],["market","Pasar"],["inventory","Gudang"],["shop","Toko"],["lb","Rank"]].map(([t,l])=>(
          <button key={t} onClick={()=>setTab(t)} style={S.tab(tab===t)}>{l}</button>
        ))}
      </div>

      {/* KEBUN */}
      {tab==="farm" && <>
        <div style={S.card}>
          <div style={{fontSize:11,color:"#94a3b8",marginBottom:8}}>Pilih benih — tap lahan untuk tanam</div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:8}}>
            {CROPS.map(c=>{
              const lck=!unlocked.includes(c.id);
              return (
                <button key={c.id} onClick={()=>!lck&&setSelCrop(c.id)}
                  style={{background:lck?"#0f172a":selCrop===c.id?"#14532d":"#0f172a",border:"2px solid "+(lck?"#334155":selCrop===c.id?"#16a34a":"#334155"),color:lck?"#475569":"#e2e8f0",borderRadius:10,padding:"7px 9px",cursor:lck?"default":"pointer",textAlign:"center",minWidth:62,opacity:lck?0.5:1,touchAction:"manipulation"}}>
                  <div style={{fontSize:22}}>{lck?"🔒":c.emoji}</div>
                  <div style={{fontSize:11,fontWeight:"bold"}}>{c.name}</div>
                  {!lck&&<div style={{color:"#fbbf24",fontSize:10}}>{fmt(c.seedPrice)}</div>}
                </button>
              );
            })}
          </div>
          {FERTILIZERS.some(f=>(fertilizers[f.id]||0)>0) && (
            <div style={{borderTop:"1px solid #334155",paddingTop:8}}>
              <div style={{fontSize:11,color:"#94a3b8",marginBottom:5}}>Pupuk aktif:</div>
              <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                <button onClick={()=>setSelFert(null)} style={{background:!selFert?"#334155":"transparent",border:"1px solid #334155",color:"#94a3b8",borderRadius:8,padding:"6px 12px",cursor:"pointer",fontSize:12,touchAction:"manipulation"}}>Tanpa pupuk</button>
                {FERTILIZERS.map(f=>(fertilizers[f.id]||0)>0&&(
                  <button key={f.id} onClick={()=>setSelFert(selFert===f.id?null:f.id)}
                    style={{background:selFert===f.id?"#14532d":"transparent",border:"1px solid "+(selFert===f.id?"#16a34a":"#334155"),color:selFert===f.id?"#4ade80":"#94a3b8",borderRadius:8,padding:"6px 12px",cursor:"pointer",fontSize:12,touchAction:"manipulation"}}>
                    {f.emoji} x{fertilizers[f.id]}
                  </button>
                ))}
              </div>
            </div>
          )}
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:7}}>
          {plots.map((plot,idx)=>{
            const prog=getProgress(plot), rdy=plot&&prog>=100;
            const cd=plot?CROPS.find(c=>c.id===plot.crop):null;
            return (
              <div key={idx} onClick={()=>plot?harvest(idx):plant(idx)}
                style={{background:rdy?"#14532d":plot?"#172a1f":"#1a1a2e",borderRadius:12,border:"2px solid "+(rdy?"#22c55e":plot?"#334155":"#2d2d4a"),padding:7,textAlign:"center",cursor:"pointer",minHeight:80,display:"flex",flexDirection:"column",justifyContent:"center",alignItems:"center",gap:3,position:"relative",touchAction:"manipulation"}}>
                {plot&&plot.fertilizer&&<div style={{position:"absolute",top:3,right:5,fontSize:10}}>{FERTILIZERS.find(f=>f.id===plot.fertilizer)?.emoji}</div>}
                {plot?<>
                  <div style={{fontSize:24}}>{rdy?cd.emoji:"🌱"}</div>
                  <div style={{fontSize:10,color:rdy?"#4ade80":"#94a3b8"}}>{rdy?"Panen!":prog+"%"}</div>
                  {!rdy&&<div style={{width:"100%",height:4,background:"#334155",borderRadius:2}}><div style={{width:prog+"%",height:"100%",background:"#16a34a",borderRadius:2}}/></div>}
                </>:<div style={{fontSize:20}}>🟫</div>}
              </div>
            );
          })}
        </div>
        {(owned.autoHarvest||owned.autoPlant)&&<div style={{fontSize:11,color:"#475569",textAlign:"center",marginTop:6}}>{owned.autoHarvest?"Auto Panen":""}{owned.autoHarvest&&owned.autoPlant?" — ":""}{owned.autoPlant?"Auto Tanam":""} aktif</div>}
      </>}

      {/* PASAR */}
      {tab==="market" && <div style={{display:"flex",flexDirection:"column",gap:8}}>
        <div style={{fontSize:11,color:"#64748b",textAlign:"center"}}>Harga berubah tiap 5 detik • Event tiap 45 detik</div>
        {CROPS.filter(c=>unlocked.includes(c.id)).map(c=>{
          const p=prices[c.id], pct=((p-c.basePrice)/c.basePrice*100).toFixed(1), up=p>=c.basePrice;
          return (
            <div key={c.id} style={{...S.card,display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:0}}>
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <span style={{fontSize:28}}>{c.emoji}</span>
                <div>
                  <div style={{fontWeight:"bold",fontSize:14}}>{c.name}</div>
                  <span style={{fontSize:10,padding:"3px 7px",borderRadius:5,fontWeight:"bold",background:up?"#14532d":"#450a0a",color:up?"#4ade80":"#f87171"}}>{up?"▲":"▼"} {Math.abs(pct)}%</span>
                </div>
              </div>
              <div style={{textAlign:"right"}}>
                <div style={{fontWeight:900,color:"#fbbf24",fontSize:15}}>{fmtFull(p)}</div>
                <Sparkline data={priceHist[c.id]}/>
              </div>
            </div>
          );
        })}
      </div>}

      {/* GUDANG */}
      {tab==="inventory" && <div style={{display:"flex",flexDirection:"column",gap:8}}>
        <div style={{...S.card,textAlign:"center",padding:"8px 12px",marginBottom:0}}>
          <span style={{fontSize:12,color:"#94a3b8"}}>Nilai gudang: </span>
          <span style={{color:"#fbbf24",fontWeight:"bold"}}>{fmtFull(invVal)}</span>
        </div>
        {CROPS.filter(c=>unlocked.includes(c.id)).map(c=>{
          const cnt=inventory[c.id]||0, pr=prices[c.id];
          return (
            <div key={c.id} style={{...S.card,display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:0,opacity:cnt>0?1:0.35}}>
              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <span style={{fontSize:28}}>{c.emoji}</span>
                <div>
                  <div style={{fontWeight:"bold",fontSize:14}}>{c.name}</div>
                  <div style={{fontSize:11,color:"#94a3b8"}}>x{cnt} — {fmtFull(pr)}/unit</div>
                  {cnt>0&&<div style={{fontSize:11,color:"#fbbf24"}}>{fmtFull(cnt*pr)}</div>}
                </div>
              </div>
              {cnt>0&&<div style={{display:"flex",flexDirection:"column",gap:5}}>
                <button onClick={()=>sell(c.id,false)} style={{...S.btn("#1e3a5f","#93c5fd")}}>Jual 1</button>
                <button onClick={()=>sell(c.id,true)}  style={{...S.btn("#14532d","#4ade80")}}>Semua</button>
              </div>}
            </div>
          );
        })}
      </div>}

      {/* TOKO */}
      {tab==="shop" && <div style={{display:"flex",flexDirection:"column",gap:8}}>
        <div style={{fontSize:11,color:"#64748b",textAlign:"center"}}>Pupuk sekali pakai — Otomasi permanen</div>
        <div style={{fontSize:12,color:"#94a3b8",fontWeight:"bold"}}>Pupuk (sekali pakai per lahan)</div>
        {FERTILIZERS.map(f=>(
          <div key={f.id} style={{...S.card,display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:0}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <span style={{fontSize:28}}>{f.emoji}</span>
              <div>
                <div style={{fontWeight:"bold",fontSize:14}}>{f.name}</div>
                <div style={{fontSize:11,color:"#94a3b8"}}>Panen {f.minM}–{f.maxM}x — Stok: {fertilizers[f.id]||0}</div>
              </div>
            </div>
            <div style={{textAlign:"right"}}>
              <div style={{fontSize:13,color:"#fbbf24",fontWeight:"bold",marginBottom:5}}>{fmtFull(f.price)}</div>
              <button onClick={()=>buyItem(f)} disabled={money<f.price} style={{...S.btn(money>=f.price?"#16a34a":"#334155")}}>Beli</button>
            </div>
          </div>
        ))}
        <div style={{fontSize:12,color:"#94a3b8",fontWeight:"bold",marginTop:4}}>Otomasi (permanen)</div>
        {[
          {id:"autoHarvest",name:"Auto Panen",emoji:"🤖",price:1000000,desc:"Panen otomatis saat matang",oneTime:true},
          {id:"autoPlant",  name:"Auto Tanam",emoji:"🚜",price:1000000,desc:"Tanam otomatis lahan kosong",oneTime:true},
        ].map(item=>(
          <div key={item.id} style={{...S.card,display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:0}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <span style={{fontSize:28}}>{item.emoji}</span>
              <div>
                <div style={{fontWeight:"bold",fontSize:14}}>{item.name}</div>
                <div style={{fontSize:11,color:"#94a3b8"}}>{item.desc}</div>
                {owned[item.id]&&<div style={{fontSize:11,color:"#4ade80"}}>Aktif</div>}
              </div>
            </div>
            <div style={{textAlign:"right"}}>
              <div style={{fontSize:13,color:"#fbbf24",fontWeight:"bold",marginBottom:5}}>{fmt(item.price)}</div>
              <button onClick={()=>!owned[item.id]&&buyItem(item)} disabled={owned[item.id]||money<item.price}
                style={{...S.btn(owned[item.id]?"#334155":money>=item.price?"#7c3aed":"#334155")}}>
                {owned[item.id]?"Aktif":"Beli"}
              </button>
            </div>
          </div>
        ))}
      </div>}

      {/* LEADERBOARD + CHAT */}
      {tab==="lb" && <div>
        <div style={{fontSize:11,color:"#64748b",textAlign:"center",marginBottom:8}}>
          {db?"Live multiplayer aktif":"Mode lokal — tambahkan Firebase untuk multiplayer"} — Kamu: #{myRank}
        </div>
        {lb.map((e,i)=>(
          <div key={i} style={{...S.card,display:"flex",alignItems:"center",gap:10,marginBottom:6,border:e.isMe?"1px solid #16a34a":e.isReal?"1px solid #2563eb":"1px solid transparent",background:e.isMe?"#14532d":e.isReal?"#1e2f4a":"#1e293b"}}>
            <div style={{fontSize:i<3?20:13,fontWeight:900,color:i===0?"#fbbf24":i===1?"#cbd5e1":i===2?"#b45309":"#475569",minWidth:28,textAlign:"center"}}>
              {i===0?"🥇":i===1?"🥈":i===2?"🥉":"#"+(i+1)}
            </div>
            <div style={{flex:1,minWidth:0}}>
              <div style={{fontWeight:"bold",color:e.isMe?"#4ade80":e.isReal?"#93c5fd":"#e2e8f0",fontSize:13,display:"flex",alignItems:"center",gap:5,flexWrap:"wrap"}}>
                {e.playerName}
                {e.isMe&&<span style={{background:"#16a34a",color:"#fff",fontSize:9,padding:"1px 5px",borderRadius:3}}>KAMU</span>}
                {!e.isMe&&e.isReal&&<span style={{background:"#2563eb",color:"#fff",fontSize:9,padding:"1px 5px",borderRadius:3}}>LIVE</span>}
              </div>
              <div style={{fontSize:10,color:"#475569",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>🌾 {e.farmName}</div>
            </div>
            <div style={{fontWeight:900,color:"#fbbf24",fontSize:13,whiteSpace:"nowrap"}}>{fmt(e.score)}</div>
          </div>
        ))}

        {/* Chat */}
        <div style={{...S.card,marginTop:4}}>
          <div style={{fontSize:12,color:"#94a3b8",fontWeight:"bold",marginBottom:8}}>
            💬 Obrolan Petani {!db&&<span style={{fontSize:10,color:"#475569",fontWeight:"normal"}}>(butuh Firebase)</span>}
          </div>
          <div style={{display:"flex",flexWrap:"wrap",gap:5,marginBottom:10}}>
            {TAUNTS.map((t,i)=>(
              <button key={i} onClick={()=>db&&sendChat(t)} style={{background:"#0f172a",border:"1px solid #334155",color:db?"#cbd5e1":"#475569",borderRadius:8,padding:"7px 10px",cursor:db?"pointer":"not-allowed",fontSize:11,touchAction:"manipulation"}}>
                {t}
              </button>
            ))}
          </div>
          <div style={{display:"flex",gap:6,marginBottom:10}}>
            <input value={chatInput} onChange={e=>setChatInput(e.target.value.slice(0,50))} placeholder={db?"Tulis pesan...":"Butuh Firebase untuk chat"}
              disabled={!db} maxLength={50}
              style={{flex:1,background:"#0f172a",border:"1px solid #334155",borderRadius:10,padding:"11px 12px",color:"#fff",fontSize:13,outline:"none",opacity:db?1:0.5}}/>
            <button onClick={()=>sendChat(chatInput)} disabled={!db||chatBusy||!chatInput.trim()} style={{...S.btn(db&&chatInput.trim()&&!chatBusy?"#16a34a":"#334155")}}>
              {chatBusy?"...":"Kirim"}
            </button>
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:6,maxHeight:220,overflowY:"auto"}}>
            {!db&&<div style={{fontSize:11,color:"#475569",textAlign:"center",padding:8}}>Tambahkan Firebase config di index.html untuk aktifkan chat multiplayer.</div>}
            {db&&chatLog.length===0&&<div style={{fontSize:11,color:"#475569",textAlign:"center",padding:8}}>Belum ada pesan. Jadilah yang pertama!</div>}
            {chatLog.map((m,i)=>(
              <div key={i} style={{background:"#0f172a",borderRadius:8,padding:"8px 10px",borderLeft:"3px solid "+(m.name===playerName?"#16a34a":"#334155")}}>
                <div style={{fontSize:11,color:m.name===playerName?"#4ade80":"#93c5fd",fontWeight:"bold",marginBottom:2}}>{m.name} — {m.farm}</div>
                <div style={{fontSize:13,color:"#e2e8f0"}}>{m.msg}</div>
              </div>
            ))}
          </div>
          {db&&<button onClick={()=>{fbFetchChat().then(setChatLog);}} style={{...S.btn("#1e293b","#64748b"),width:"100%",marginTop:8,fontSize:11}}>Refresh Chat</button>}
        </div>
      </div>}

      {/* Log */}
      <div style={{background:"#0a0f1e",borderRadius:12,padding:10,marginTop:8,border:"1px solid #1e293b"}}>
        <div style={{fontSize:10,color:"#334155",marginBottom:4}}>Aktivitas</div>
        {gameLog.map((l,i)=><div key={i} style={{fontSize:11,color:i===0?"#cbd5e1":"#334155",padding:"2px 0"}}>{l}</div>)}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
